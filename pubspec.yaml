name: doctogp
description: All-in-one GP clinic platform for patients, receptionists, doctors, and labs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  rxdart: ^0.27.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # State & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  intl: ^0.19.0

  # Voice-to-text (optional prescription input)
  speech_to_text: ^7.0.0

  # Utils
  uuid: ^4.5.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/icd10_fallback.json